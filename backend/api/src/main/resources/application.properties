spring.application.name=partaay-event-backend

server.port=8181

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/partaay
spring.datasource.username=postgres
spring.datasource.password=${PARTAAY_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

app.jwt.secret=${APP_JWT_SECRET:partaay-development-secret-key-change-me-1234567890}
